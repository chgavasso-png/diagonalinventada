<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Ponto</title>
    <link rel="icon" type="image/png" href="logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .scale-in { animation: scaleIn 0.25s ease-out; }
        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.92); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes blob {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -40px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.95); }
        }
        .blob { animation: blob 16s infinite ease-in-out; }
        .blob-delay { animation-delay: -6s; }

        .spinner {
            width: 22px; height: 22px; border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.35);
            border-top-color: #fff;
            animation: spin 0.7s linear infinite;
            display: inline-block;
        }
        .spinner-dark {
            border: 3px solid rgba(15,23,42,0.15);
            border-top-color: #0f172a;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .btn-loading .btn-text { visibility: hidden; }
        .btn-loading .btn-spinner { display: inline-flex !important; }
        .btn-spinner { position: absolute; inset: 0; align-items: center; justify-content: center; }

        .skeleton {
            background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 37%, #f1f5f9 63%);
            background-size: 400% 100%;
            animation: skeletonWave 1.4s ease-in-out infinite;
        }
        @keyframes skeletonWave {
            0% { background-position: 100% 50%; }
            100% { background-position: 0 50%; }
        }
    </style>
</head>
<body class="relative min-h-screen font-sans flex items-center justify-center p-4 overflow-x-hidden bg-gradient-to-br from-slate-50 via-white to-orange-50">

    <!-- Blobs decorativos de fundo -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none -z-10">
        <div class="blob absolute -top-24 -left-24 w-72 h-72 sm:w-96 sm:h-96 bg-orange-200/40 rounded-full blur-3xl"></div>
        <div class="blob blob-delay absolute bottom-0 right-0 w-72 h-72 sm:w-[28rem] sm:h-[28rem] bg-slate-300/30 rounded-full blur-3xl"></div>
    </div>

    <!-- TELA 1: INÍCIO (Quiosque) -->
    <div id="view-home" class="relative z-10 w-full max-w-4xl text-center fade-in">
        <div class="bg-white/80 backdrop-blur-xl border border-white/70 rounded-3xl shadow-2xl shadow-slate-300/40 p-8 sm:p-16">
            <img src="logo.png" alt="Logo da Empresa" class="h-28 sm:h-40 mx-auto mb-6 object-contain drop-shadow-sm" onerror="this.src='https://via.placeholder.com/250x100?text=Sua+Logo+Aqui'">

            <h1 class="text-xl sm:text-2xl font-bold text-slate-800 mb-4 tracking-widest uppercase">Controle de Frequência</h1>

            <div class="inline-flex flex-col items-center gap-1 bg-slate-900 text-white px-6 sm:px-10 py-3 sm:py-5 rounded-2xl mb-8 sm:mb-12 shadow-xl shadow-slate-400/30 border border-slate-700/50">
                <div class="flex items-center gap-2">
                    <span class="w-2 h-2 sm:w-2.5 sm:h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
                    <p id="relogio-home-hora" class="font-mono font-black text-3xl sm:text-5xl tracking-wider leading-none tabular-nums"></p>
                </div>
                <p id="relogio-home-data" class="text-[11px] sm:text-sm text-slate-300 font-bold uppercase tracking-widest mt-1"></p>
            </div>

            <button id="btn-giant-clockin" class="relative w-full sm:w-auto bg-orange-500 hover:bg-orange-600 text-white font-extrabold text-3xl sm:text-5xl py-8 px-8 sm:py-16 sm:px-32 rounded-xl shadow-[0_10px_20px_rgba(249,115,22,0.3)] transition-all transform hover:-translate-y-1 active:translate-y-1 active:shadow-sm mb-12 sm:mb-16 border-b-8 border-orange-700">
                CLOCK IN
            </button>

            <div>
                <button id="btn-show-admin" class="text-slate-500 hover:text-slate-900 hover:bg-slate-100 font-bold uppercase tracking-wide text-xs sm:text-sm transition flex items-center justify-center mx-auto gap-2 px-4 py-2 rounded-full">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                    Acesso Restrito (Admin)
                </button>
            </div>
        </div>
    </div>

    <!-- TELA 2: LISTA DE FUNCIONÁRIOS -->
    <div id="view-employees" class="relative z-10 w-full max-w-5xl hidden fade-in">
        <div class="flex justify-between items-center mb-6 sm:mb-8 bg-gradient-to-r from-slate-900 to-slate-800 p-4 sm:p-6 rounded-2xl shadow-lg text-white">
            <h2 class="text-lg sm:text-2xl font-bold uppercase tracking-wide">Selecione seu Perfil</h2>
            <button id="btn-back-home" class="text-slate-900 bg-white hover:bg-gray-200 px-4 py-2 text-sm sm:text-base sm:px-6 rounded-lg font-bold transition">Voltar</button>
        </div>

        <div id="employee-grid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4 sm:gap-6"></div>
    </div>

    <!-- TELA 3: MODAL DE PIN (Funcionário) -->
    <div id="modal-pin" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-white p-6 sm:p-8 rounded-2xl shadow-2xl w-full max-w-sm text-center relative border-t-8 border-orange-500 scale-in">
            <button id="btn-close-pin" class="absolute top-2 right-4 text-gray-400 hover:text-gray-800 font-bold text-3xl transition">&times;</button>

            <img id="pin-foto" src="" class="w-24 h-24 sm:w-28 sm:h-28 rounded-full mx-auto border-4 border-slate-100 object-cover mb-4 shadow-sm">
            <h3 id="pin-nome" class="text-lg sm:text-xl font-bold text-slate-800 mb-1">Nome</h3>
            <p id="pin-cargo" class="text-xs sm:text-sm font-medium text-slate-500 mb-6 uppercase tracking-wider">Cargo</p>

            <form id="form-pin" class="space-y-4 sm:space-y-5">
                <div>
                    <input type="password" id="input-pin" placeholder="PIN" maxlength="6" pattern="\d{6}" class="w-full px-4 py-3 sm:py-4 text-center text-xl sm:text-2xl tracking-[0.3em] sm:tracking-[0.5em] border-2 border-slate-200 rounded-lg focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-200 transition" required>
                </div>
                <div id="erro-pin" class="text-red-600 text-sm hidden font-bold bg-red-50 p-2 rounded">PIN incorreto!</div>
                <button type="submit" id="btn-confirmar-pin" class="relative w-full bg-orange-500 text-white font-bold py-3 sm:py-4 rounded-lg hover:bg-orange-600 shadow-md transition uppercase tracking-wide disabled:opacity-70">
                    <span class="btn-text">Confirmar Acesso</span>
                    <span class="btn-spinner hidden"><span class="spinner"></span></span>
                </button>
            </form>
        </div>
    </div>

    <!-- TELA 4: LOGIN DO ADMIN -->
    <div id="view-admin" class="relative z-10 w-full max-w-sm hidden fade-in">
        <div class="relative bg-white/90 backdrop-blur-xl border border-white/70 p-6 sm:p-8 pt-8 sm:pt-10 rounded-3xl shadow-2xl shadow-slate-400/30 overflow-hidden">
            <div class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-slate-900 via-slate-700 to-orange-500"></div>
            <button id="btn-back-home-admin" class="absolute top-4 right-4 text-slate-400 hover:text-slate-800 font-bold text-2xl transition">&times;</button>

            <div class="flex flex-col items-center text-center mb-6 sm:mb-8">
                <div class="w-14 h-14 sm:w-16 sm:h-16 rounded-2xl bg-slate-900 flex items-center justify-center mb-3 shadow-lg shadow-slate-400/40">
                    <svg class="w-7 h-7 sm:w-8 sm:h-8 text-orange-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                </div>
                <h2 class="text-lg sm:text-xl font-bold text-slate-800 uppercase tracking-wide">Painel Admin</h2>
                <p class="text-xs text-slate-400 font-medium mt-1">Acesso restrito à administração</p>
            </div>

            <form id="form-admin" class="space-y-4 sm:space-y-5">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-1.5">Matrícula Admin</label>
                    <input type="text" id="admin-matricula" class="w-full px-4 py-3 bg-white border-2 border-slate-200 rounded-xl focus:outline-none focus:border-slate-900 focus:ring-2 focus:ring-slate-200 transition" required>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-1.5">Senha (PIN)</label>
                    <input type="password" id="admin-pin" class="w-full px-4 py-3 bg-white border-2 border-slate-200 rounded-xl focus:outline-none focus:border-slate-900 focus:ring-2 focus:ring-slate-200 transition" required>
                </div>
                <div id="erro-admin" class="text-red-600 text-sm hidden font-bold bg-red-50 p-2 rounded text-center break-words"></div>
                <button type="submit" id="btn-confirmar-admin" class="relative w-full bg-slate-900 text-white font-bold py-3 sm:py-4 rounded-xl hover:bg-slate-800 shadow-md transition uppercase tracking-wide disabled:opacity-70">
                    <span class="btn-text">Entrar no Painel</span>
                    <span class="btn-spinner hidden"><span class="spinner"></span></span>
                </button>
            </form>
        </div>
    </div>

    <!-- OVERLAY GLOBAL DE CARREGAMENTO / REDIRECIONAMENTO -->
    <div id="loading-overlay" class="fixed inset-0 bg-slate-900/70 backdrop-blur-sm hidden items-center justify-center z-[100]">
        <div class="bg-white rounded-2xl shadow-2xl px-10 py-8 flex flex-col items-center gap-4 scale-in">
            <span class="spinner spinner-dark" style="width:36px;height:36px;border-width:4px;"></span>
            <p id="loading-overlay-text" class="text-slate-700 font-bold uppercase tracking-wide text-sm">Entrando...</p>
        </div>
    </div>

    <script src="./js/supabase.js"></script>
    <script src="./js/timezone.js"></script>
    <script src="./js/login.js"></script>
</body>
</html>
