<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Funcionário - Controle de Ponto</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .foto-hover { position: relative; display: inline-block; }
        .foto-hover::after { content: '📷 Alterar'; position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.6); color: white; font-size: 0.75rem; font-weight: bold; text-align: center; padding: 6px 0; border-bottom-left-radius: 9999px; border-bottom-right-radius: 9999px; opacity: 0; transition: opacity 0.3s; }
        .foto-hover:hover::after { opacity: 1; }
    </style>
</head>
<body class="bg-white min-h-screen font-sans">

    <nav class="bg-slate-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between h-14 sm:h-16 items-center">
            <div class="font-bold text-sm sm:text-xl tracking-wide uppercase">Registro de Ponto</div>
            <button onclick="fazerLogout()" class="text-xs sm:text-sm bg-slate-800 px-3 py-2 sm:px-4 sm:py-2 rounded-lg font-bold hover:bg-red-600 transition">Sair</button>
        </div>
    </nav>

    <main class="max-w-3xl mx-auto mt-4 sm:mt-10 px-4 pb-10">
        
        <div class="bg-white rounded-2xl shadow-lg p-4 sm:p-8 text-center border-t-8 border-orange-500 relative">
            
            <input type="file" id="input-foto-funcionario" accept="image/*" class="hidden">
            <div class="foto-hover cursor-pointer transition transform hover:scale-105 mx-auto mb-4 rounded-full shadow-sm" id="container-foto-funcionario" title="Clique para alterar sua foto">
                <img id="foto-perfil" src="https://via.placeholder.com/100" class="w-24 h-24 sm:w-28 sm:h-28 rounded-full border-4 border-slate-100 object-cover">
            </div>

            <h2 id="nome-funcionario" class="text-2xl sm:text-3xl font-black text-slate-800">Carregando...</h2>
            <p id="cargo-funcionario" class="text-sm sm:text-base text-slate-500 font-medium">Carregando...</p>
            
            <div class="mt-6 sm:mt-8 bg-slate-50 py-4 sm:py-6 rounded-xl border border-slate-100">
                <p id="data-atual" class="text-sm sm:text-lg text-slate-500 font-bold uppercase tracking-wider"></p>
                <div id="relogio" class="text-4xl sm:text-6xl font-black text-slate-800 mt-2 font-mono tracking-widest drop-shadow-sm">00:00:00</div>
            </div>

            <div class="mt-6 sm:mt-10 flex flex-col sm:flex-row justify-center gap-4 sm:gap-6">
                <button id="btn-clock-in" class="flex-1 bg-emerald-500 hover:bg-emerald-600 text-white font-black py-4 px-6 sm:py-6 sm:px-8 rounded-2xl shadow-[0_10px_20px_rgba(16,185,129,0.3)] flex flex-col items-center justify-center gap-2 transition-all transform hover:-translate-y-1 active:translate-y-1 active:shadow-sm">
                    <svg class="w-8 h-8 sm:w-10 sm:h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path></svg>
                    <span class="text-xl sm:text-2xl tracking-wide">CLOCK IN</span>
                    <span class="text-xs font-medium opacity-80 uppercase">Registrar Entrada</span>
                </button>
                
                <button id="btn-clock-out" class="flex-1 bg-orange-500 hover:bg-orange-600 text-white font-black py-4 px-6 sm:py-6 sm:px-8 rounded-2xl shadow-[0_10px_20px_rgba(249,115,22,0.3)] flex flex-col items-center justify-center gap-2 transition-all transform hover:-translate-y-1 active:translate-y-1 active:shadow-sm">
                    <svg class="w-8 h-8 sm:w-10 sm:h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                    <span class="text-xl sm:text-2xl tracking-wide">CLOCK OUT</span>
                    <span class="text-xs font-medium opacity-80 uppercase">Registrar Saída</span>
                </button>
            </div>

            <button onclick="fazerLogout()" class="mt-6 sm:mt-8 w-full bg-slate-800 hover:bg-red-600 text-white font-bold py-3 sm:py-4 rounded-xl transition uppercase tracking-wide shadow-md">
                🚪 Sair e Voltar ao Início
            </button>

            <div id="mensagem-status" class="mt-6 text-sm font-bold p-4 rounded-lg hidden transition-all"></div>
        </div>

        <div class="bg-white rounded-2xl shadow-lg overflow-hidden mt-6 sm:mt-8">
            <div class="bg-slate-900 px-4 sm:px-6 py-4 flex justify-between items-center">
                <h3 class="text-base sm:text-lg font-bold text-white uppercase tracking-wide">Histórico do Mês</h3>
            </div>
            <div class="p-4 sm:p-6">
                <div id="lista-historico" class="space-y-3">
                    <p class="text-slate-500 text-center text-sm font-medium">Buscando registros...</p>
                </div>
            </div>
        </div>
    </main>

    <script src="./js/supabase.js"></script>
    <script src="./js/funcionario.js"></script>
</body>
</html>
